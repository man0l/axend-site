name: build-and-deploy
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
concurrency: { group: deploy-${{ github.ref }}, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Preview phase: keep the site out of search engines. Remove at go-live.
      PUBLIC_NOINDEX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --test src/lib/metrics.test.ts
      - run: npm run build
      # main: production Worker (workers.dev only until the board OKs axendai.com). PRs: a non-live preview version.
      - name: Deploy
        if: github.event_name != 'pull_request'
        run: npx wrangler deploy
      - name: Upload preview version
        if: github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler versions upload
